{
    // Format version of this document
    "version": "1.0",

    // Directory holding metadata such as the log and schemas
    "directory": "./tmp",
    // Directories holding data, as objects of a "path" and an optional "max_size"
    "data_directories": [],
    // I/O layer disks are accessed through: "posix", "pulling" or "spdk"
    "io_mechanism": "pulling",
    // Queue depth of each disk for batched I/O
    "io_queue_depth": 4096,

    // Host memory the database may use, in bytes or as text such as "1 GB"
    "memory_limit": 1000000000,
    // Background threads
    "threads": 1,
    // GPU memory compaction may use
    "gpu_memory_limit": 1000000000,
    // GPU device indices compaction may use
    "gpu_devices": [-1],

    // Read cache bytes of a collection, zero to disable; batch reads bypass it
    "cache_limit": 100000000,
    // Values the write buffer holds before flushing them into a file
    "write_buffer_max_elements": 100000,
    // Bytes the write buffer holds before flushing them into a file
    "write_buffer_max_bytes": 100000000,
    // Bytes the first level holds before compacting into the next
    "first_level_max_bytes": 1000000000,
    // Threads that may access a collection at once
    "concurrency_limit": 64,
    // Factor each level's capacity grows by over the previous one
    "level_enlarge_factor": 4,
    // Size of every value in builtin and fixed-size collections, zero for variable-size ones
    "value_size": 0,
    // Largest value in variable-size collections, zero for builtin and fixed-size ones
    "value_max_size": 4096,

    // Values one transaction may stage before it must commit
    "transaction_max_elements": 100000,
    // Bytes one transaction may stage before it must commit
    "transaction_max_bytes": 100000000
}
