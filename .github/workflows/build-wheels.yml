name: Build Python Wheels

on:
  workflow_call:
    inputs:
      smoke:
        description: "Build one GIL and one free-threaded interpreter on Linux and macOS only"
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONUTF8: 1
  PYTHONFAULTHANDLER: 1

jobs:
  build_wheels:
    name: Build Python Wheels for ${{ matrix.os }} cp${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # One entry per interpreter variant: a `cp314-*` glob stops before the `t`.
        python-version: ${{ fromJSON(inputs.smoke && '["312", "315t"]' || '["312", "313", "314", "314t", "315", "315t"]') }}
        os: ${{ fromJSON(inputs.smoke && '["ubuntu-26.04", "macos-26"]' || '["ubuntu-26.04", "ubuntu-26.04-arm", "macos-26", "windows-2025", "windows-11-arm"]') }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install cibuildwheel
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 10
          timeout_minutes: 180
          command: python -m pip install 'cibuildwheel==4.3.5'
      - name: Build Wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp${{ matrix.python-version }}-*
          CIBW_ARCHS: native
          CIBW_SKIP: "*-musllinux_*"

      # The ABI tag tells a free-threaded wheel apart from the GIL one.
      - name: Assert the Expected Interpreter Was Built
        shell: bash
        run: |
          ls -la wheelhouse/
          count=$(find wheelhouse -name "*-cp${{ matrix.python-version }}-*.whl" | wc -l)
          echo "wheels carrying ABI tag cp${{ matrix.python-version }}: ${count}"
          test "$count" -gt 0

      - name: Upload Wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-${{ matrix.os }}-cp${{ matrix.python-version }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Build Python Source Distribution
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Build Source Distribution
        run: |
          python -m pip install --upgrade build
          python -m build --sdist

      # The extension configures from the siblings' CMake trees and instruction-set probes, so the sdist must configure
      # on its own, not merely carry the headers.
      - name: Configure the Unpacked Source Distribution
        run: |
          mkdir sdist_check && tar xzf dist/*.tar.gz -C sdist_check --strip-components=1
          cmake -S sdist_check -B sdist_check/build -DUSTORE_BUILD_PYTHON=ON

      - name: Upload Source Distribution
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
