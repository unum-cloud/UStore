  test_ubuntu_asan:
    name: Test ASan and UBSan on Ubuntu x86-64
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Pull Git Submodules
        run: git submodule update --init --recursive

      - name: Install Toolchain on Linux
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/resolute/ llvm-toolchain-resolute-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update && sudo apt-get install -y clang-23 lld-23 ninja-build
      - name: Install Toolchain on macOS
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install Toolchain on Windows
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - name: Set Up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      # Sanitizer runtimes crash under the runner kernel's 32-bit mmap randomization.
      - name: Lower ASLR Entropy
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Restore Fetched Dependencies
        uses: actions/cache@v6
        with:
          path: build_asan/_deps
          key: deps-${{ runner.os }}-${{ runner.arch }}-asan-${{ hashFiles('cmake/*.cmake') }}

      - name: Configure
        run: cmake --preset asan -D CMAKE_C_COMPILER=clang-23 -D CMAKE_CXX_COMPILER=clang++-23
