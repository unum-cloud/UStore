      - name: Test
        run: ctest --preset tsan --exclude-regex '^ustore_test_cpp(_stub)?$'

  # StringZilla's RVV kernels need Clang 21 or newer, which apt.llvm.org publishes for Ubuntu 26.04; Trixie's cross
  # compilers stop at GCC 14, short of the GCC 16 the toolchain file names. The toolchain's `max` core runs both the
  # C930 class and serial.
  test_qemu_riscv:
    name: Test RISC-V under QEMU
    runs-on: ubuntu-26.04
    container: ubuntu:26.04
    timeout-minutes: 120
    steps:
      # `git` must precede `actions/checkout`, or it falls back to the tarball API.
      - name: Install Dependencies
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl gnupg \
            cmake ninja-build qemu-user gcc-16-riscv64-linux-gnu g++-16-riscv64-linux-gnu libc6-dev-riscv64-cross
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/resolute/ llvm-toolchain-resolute-23 main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update
          apt-get install -y clang-23 lld-23 llvm-23
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Pull Git Submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --recursive
      - name: Configure
        run: cmake --preset linux_riscv64
      - name: Build
        run: cmake --build --preset linux_riscv64
      - name: Test
        run: ctest --preset linux_riscv64 --exclude-regex '^ustore_test_cpp(_stub)?$'

  # POWER9 Power VSX kernels scope per function only from GCC 15 on, which Ubuntu 26.04 ships as a cross compiler. The
  # toolchain's `power10` core runs both the POWER10 class and serial.
  test_qemu_power:
    name: Test POWER10 under QEMU
    runs-on: ubuntu-26.04
    container: ubuntu:26.04
    timeout-minutes: 120
    steps:
      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates cmake ninja-build qemu-user \
            gcc-15-powerpc64le-linux-gnu g++-15-powerpc64le-linux-gnu
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Pull Git Submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --recursive
      - name: Configure
        run: cmake --preset linux_ppc64le
      - name: Build
        run: cmake --build --preset linux_ppc64le
      - name: Test
        run: ctest --preset linux_ppc64le --exclude-regex '^ustore_test_cpp(_stub)?$'

  # Each machine profile builds the libraries for one CPU and one GPU code; the Arm ones build natively on Arm runners,
  # where the CUDA image also exists. Clang 22 compiles the host units, as Ubuntu 24.04's GCC predates Olympus, and the
  # family codes like `100f` need CMake 3.31, where Ubuntu 24.04 ships 3.28. The siblings come from their pins.
  build_machine_profile:
    name: Build Machine Profile ${{ matrix.preset }}
    runs-on: ${{ contains(fromJSON('["grace_hopper", "vera_rubin"]'), matrix.preset) && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    container: nvidia/cuda:13.4.3-devel-ubuntu26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [xeon4_hopper, xeon6_blackwell, venice_mi450, grace_hopper, vera_rubin]
    env:
      CC: clang-22
      CXX: clang++-22
    steps:
      - name: Install Dependencies
        run: |
          apt-get update && apt-get install -y ninja-build g++ git python3-pip curl gnupg
          pip install --break-system-packages "cmake>=3.31"
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/resolute/ llvm-toolchain-resolute-22 main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update && apt-get install -y clang-22 lld-22
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Build
        run: |
          cmake --preset ${{ matrix.preset }} -D CMAKE_C_COMPILER="$CC" -D CMAKE_CXX_COMPILER="$CXX" -D CMAKE_CUDA_HOST_COMPILER="$CXX"
          cmake --build --preset ${{ matrix.preset }}

  # The NDK's own toolchain builds the libraries over the RAM engine; nothing runs them.
  build_android:
    name: Build for Android ARM64
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Pull Git Submodules
        run: git submodule update --init --recursive
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build
        run: |
          export ANDROID_NDK_ROOT="${ANDROID_NDK_LATEST_HOME}"
          cmake --preset android_arm64
          cmake --build --preset android_arm64

  # glibc 2.28 and Linux 4.18 headers, which hold no io_uring, so the NVMe engine builds from its own kernel mirrors;
  # the test runs on the runner's new kernel, where the mirrors meet the real ABI.
  test_old_kernel_headers:
    name: Build C Library on Old Kernel Headers
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Pull Git Submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --recursive
      - name: Build C Library
        run: |
          cmake -B build_old_headers -D CMAKE_BUILD_TYPE=Release -D USTORE_WITH_NVME=ON -D USTORE_BUILD_TEST=ON \
            -D USTORE_BUILD_BENCH=OFF -D USTORE_BUILD_TOOLS=OFF
          cmake --build build_old_headers --parallel 4 --target ustore_test_c ustore_test_nvme_volume
      - name: Test C Library
        run: ctest --test-dir build_old_headers --tests-regex '^ustore_test_(c|nvme_volume)$' --output-on-failure

  # The minimal and the extended module over the RAM engine; nothing runs them.
  build_wasm:
    name: Build WASM Module with ${{ matrix.preset }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [wasm32_emscripten, wasm64_emscripten]
    env:
      EMSCRIPTEN_VERSION: "6.0.9"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Pull Git Submodules
        run: git submodule update --init --recursive
      - name: Install Ninja and Emscripten
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          (cd ~/emsdk && ./emsdk install "$EMSCRIPTEN_VERSION" && ./emsdk activate "$EMSCRIPTEN_VERSION")
      - name: Build
        run: |
          source ~/emsdk/emsdk_env.sh
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}

  verify_models:
    name: Check Promela Models and GenMC Clients
    runs-on: ubuntu-26.04
    container: ghcr.io/ashvardanian/fatwheels:verify@sha256:c29899edae67fe85f0fa80ec3dfaa577a24e297cd4796c0fcdddda60a9010415
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Pull the ForkUnion Submodule
        run: git submodule update --init forkunion
      - name: Check the Models and the Clients
        run: verification/check.sh
