name: Test C

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # The release preset builds with Clang, AppleClang on macOS, while the sanitizer presets also assume lld.
  test_ubuntu:
    name: Test on Ubuntu x86-64
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Pull Git Submodules
        run: git submodule update --init --recursive

      - name: Install Toolchain on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang lld ninja-build
      - name: Install Toolchain on macOS
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install Toolchain on Windows
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - name: Set Up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      - name: Restore Fetched Dependencies
        uses: actions/cache@v6
        with:
          path: build_release/_deps
          key: deps-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('cmake/*.cmake') }}

      # The NVMe engine calls io_uring directly, so no liburing is installed; its io_uring and SPDK suites skip on hosted runners
      - name: Configure with the NVMe Engine
        run: cmake --preset release -D USTORE_WITH_NVME=ON
      # MSVC compiles the C headers as C11 here, so a construct only Clang or GCC accepts fails this step by name
      - name: Build the C Tests with MSVC
        if: runner.os == 'Windows'
        run: cmake --build --preset release --target ustore_test_c ustore_test_c_shared
      # The shared twin runs against the DLL, which exports only what `USTORE_EXPORT` marks
      - name: Run the C Tests against the Static and Shared Libraries
        if: runner.os == 'Windows'
        run: ctest --preset release --tests-regex '^ustore_test_c(_shared)?$'
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release

