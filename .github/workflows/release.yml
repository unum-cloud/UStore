name: Release

on:
  push:
    branches: ["main"]

env:
  GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
  PYTHONUTF8: 1

permissions:
  contents: write
  id-token: write

jobs:
  versioning:
    name: Update Version
    # Every other job needs this one, so a private fork never tags, releases or publishes.
    if: github.repository == 'unum-cloud/UStore'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run TinySemVer
        uses: ashvardanian/tinysemver@v3
        with:
          verbose: "true"
          version-file: "VERSION"
          update-version-in: |
            CITATION.cff:^version: (\d+\.\d+\.\d+(?:-rc\.\d+)?)
            pyproject.toml:^version = "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            Cargo.toml:^version = "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
          update-major-version-in: |
            c/ustore/types.h:^#define USTORE_VERSION_MAJOR (\d+)
          update-minor-version-in: |
            c/ustore/types.h:^#define USTORE_VERSION_MINOR (\d+)
          update-patch-version-in: |
            c/ustore/types.h:^#define USTORE_VERSION_PATCH (\d+)
          dry-run: "false"
          push: "true"
          create-release: "true"
          github-token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

  rebase:
    name: Rebase Dev Branch
    needs: versioning
    runs-on: ubuntu-26.04
    steps:
      - name: Check Out the Latest Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The push below inherits this credential; the default token holds no role to bypass branch protection.
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
      - name: Perform Rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main-dev
          git rebase origin/main
      - name: Push Changes
        uses: CasperWA/push-protected@v2
        with:
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
          branch: main-dev
          force: True

  build_libraries:
    name: Libraries ${{ matrix.platform }}
    needs: versioning
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # The release preset builds with each platform's own toolchain.
        include:
          - { platform: linux_x86_64, os: ubuntu-26.04 }
          - { platform: linux_aarch64, os: ubuntu-26.04-arm }
          - { platform: macos_arm64, os: macos-26 }
          - { platform: windows_x86_64, os: windows-2025 }
          - { platform: windows_arm64, os: windows-11-arm }
    defaults:
      run:
        shell: bash
    steps:
      - name: Check Out Refreshed Version
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Pull Git Submodules
        run: git submodule update --init --recursive

      - name: Install Toolchain on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang lld ninja-build
      - name: Install Toolchain on macOS
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install Toolchain on Windows
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - name: Set Up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      - name: Restore Fetched Dependencies
        uses: actions/cache@v6
        with:
          path: build_release/_deps
          key: deps-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('cmake/*.cmake') }}

      # The preset names Clang, which Windows packages replace with MSVC
      - name: Build
        run: |
          cmake --preset release ${{ runner.os == 'Windows' && '-DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl' || '' }} \
            -DUSTORE_INSTALL=ON \
            -DUSTORE_BUILD_TEST=OFF \
            -DUSTORE_BUILD_BENCH=OFF \
            -DUSTORE_BUILD_TOOLS=OFF
          cmake --build --preset release

      - name: Archive the Headers, Libraries and CMake Package
        run: |
          archive="ustore_${{ matrix.platform }}_$(cat VERSION)"
          cmake --install build_release --prefix "$archive"
          tar -czf "$archive.tar.gz" "$archive"

      - name: Upload Archive
        uses: xresloader/upload-to-github-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "ustore_${{ matrix.platform }}_*.tar.gz"
          update_latest_release: true

  build_wheels:
    name: Wheels ${{ matrix.os }} cp${{ matrix.python-version }}
    needs: versioning
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # One entry per interpreter variant: a `cp314-*` glob stops before the `t`.
        python-version: ["312", "313", "314", "314t", "315", "315t"]
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-26, windows-2025, windows-11-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Pull Git Submodules
        run: git submodule update --init --recursive
      - name: Build Wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_BUILD: cp${{ matrix.python-version }}-*
          CIBW_ARCHS: native
          CIBW_SKIP: "*-musllinux_*"

      # The ABI tag tells a free-threaded wheel apart from the GIL one.
      - name: Assert the Expected Interpreter Was Built
        shell: bash
        run: |
          ls -la wheelhouse/
          count=$(find wheelhouse -name "*-cp${{ matrix.python-version }}-*.whl" | wc -l)
          echo "wheels carrying ABI tag cp${{ matrix.python-version }}: ${count}"
          test "$count" -gt 0

      - name: Upload Wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-${{ matrix.os }}-cp${{ matrix.python-version }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Source Distribution
    needs: versioning
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Pull Git Submodules
        run: git submodule update --init --recursive
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Build Source Distribution
        run: |
          python -m pip install --upgrade build
          python -m build --sdist

      # The extension configures from the siblings' CMake trees and instruction-set probes, so the sdist must configure
      # on its own, not merely carry the headers.
      - name: Configure the Unpacked Source Distribution
        run: |
          mkdir sdist_check && tar xzf dist/*.tar.gz -C sdist_check --strip-components=1
          cmake -S sdist_check -B sdist_check/build -DUSTORE_BUILD_PYTHON=ON

      - name: Upload Source Distribution
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish_python:
    name: Publish Python
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/p/ustore
    permissions:
      id-token: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "{cibw-*,sdist}"
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verbose: true
          print-hash: true

  publish_rust:
    name: Publish Rust
    needs: versioning
    runs-on: ubuntu-26.04
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Check Out Refreshed Version
        if: env.CARGO_REGISTRY_TOKEN != ''
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Pull Git Submodules
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: git submodule update --init --recursive
      - name: Set Up Rust
        if: env.CARGO_REGISTRY_TOKEN != ''
        uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish

  build_docs:
    name: Build Docs
    runs-on: ubuntu-26.04
    needs: publish_python
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Doxygen
        run: |
          curl -sSfL https://www.doxygen.nl/files/doxygen-1.18.0.linux.bin.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-1.18.0/bin" >> "$GITHUB_PATH"
      - name: Install Sphinx
        run: pip install -r docs/requirements.txt
      - name: Install the Released UStore
        run: pip install "ustore==$(cat VERSION)"
      - name: Build Docs
        run: cd docs && doxygen conf.dox && sphinx-build -M html . ../build/docs -W
      - name: Compress Docs
        run: tar -czf docs.tar.gz build/docs/html/
      - name: Upload Docs to Release
        uses: xresloader/upload-to-github-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: docs.tar.gz
          update_latest_release: true

  deploy_docs_pages:
    name: Deploy GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    needs: build_docs
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Download Release Assets
        uses: robinraju/release-downloader@v1.13
        with:
          latest: true
          fileName: docs.tar.gz
      - name: Unpack Docs
        run: tar -xf ./docs.tar.gz
      - name: Set Up GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build/docs/html
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
