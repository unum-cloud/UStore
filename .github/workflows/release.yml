name: Release

on:
  push:
    branches: ["main"]

env:
  GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
  PYTHONUTF8: 1

permissions:
  contents: write
  id-token: write

jobs:
  versioning:
    name: Update Version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run TinySemVer
        uses: ashvardanian/tinysemver@v3
        with:
          verbose: "true"
          version-file: "VERSION"
          update-version-in: |
            CITATION.cff:^version: (\d+\.\d+\.\d+)
            pyproject.toml:^version = "(\d+\.\d+\.\d+)"
            Cargo.toml:^version = "(\d+\.\d+\.\d+)"
          update-major-version-in: |
            include/ustore/ustore.h:^#define USTORE_VERSION_MAJOR (\d+)
          update-minor-version-in: |
            include/ustore/ustore.h:^#define USTORE_VERSION_MINOR (\d+)
          update-patch-version-in: |
            include/ustore/ustore.h:^#define USTORE_VERSION_PATCH (\d+)
          dry-run: "false"
          push: "true"
          create-release: "true"
          github-token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

  rebase:
    name: Rebase Dev Branch
    needs: versioning
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the latest code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The push below inherits this credential; the default token holds no role to bypass branch protection.
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
      - name: Perform Rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main-dev
          git rebase origin/main
      - name: Push Changes
        uses: CasperWA/push-protected@v2
        with:
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
          branch: main-dev
          force: True

  build_libraries:
    name: Libraries ${{ matrix.platform }}
    needs: versioning
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # The base preset's clang and lld are installed on Linux only: macOS links with ld64, Windows builds with MSVC.
        include:
          - { platform: linux_x86_64, os: ubuntu-24.04, configure: "" }
          - { platform: linux_aarch64, os: ubuntu-24.04-arm, configure: "" }
          - { platform: macos_arm64, os: macos-15, configure: "-DCMAKE_EXE_LINKER_FLAGS= -DCMAKE_SHARED_LINKER_FLAGS=" }
          - {
              platform: windows_x86_64,
              os: windows-2025,
              configure: "-DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_EXE_LINKER_FLAGS= -DCMAKE_SHARED_LINKER_FLAGS=",
            }
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out refreshed version
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Pull Git submodules
        run: git submodule update --init --recursive

      - name: Install Toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang lld ninja-build
      - name: Install Toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install Toolchain (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - name: Set Up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore Fetched Dependencies
        uses: actions/cache@v6
        with:
          path: build_release/_deps
          key: deps-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('cmake/*.cmake') }}

      - name: Build
        run: |
          cmake --preset release ${{ matrix.configure }} \
            -DUSTORE_INSTALL=ON \
            -DUSTORE_BUILD_TEST_CPP=OFF \
            -DUSTORE_BUILD_BENCH_CPP=OFF \
            -DUSTORE_BUILD_TOOLS_CPP=OFF
          cmake --build --preset release

      - name: Archive Headers and Static Libraries
        run: |
          archive="ustore_${{ matrix.platform }}_$(cat VERSION)"
          cmake --install build_release --prefix "$archive"
          tar -czf "$archive.tar.gz" "$archive"

      - name: Upload Archive
        uses: xresloader/upload-to-github-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "ustore_${{ matrix.platform }}_*.tar.gz"
          update_latest_release: true

  build_wheels:
    name: Wheels ${{ matrix.os }} cp${{ matrix.python-version }}
    needs: versioning
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # One entry per interpreter variant: a `cp314-*` glob stops before the `t`.
        python-version: ["312", "313", "314", "314t"]
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Build Wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: cp${{ matrix.python-version }}-*
          CIBW_ARCHS: native
          CIBW_SKIP: "*-musllinux_*"
          CIBW_TEST_COMMAND: python -c "import ustore"

      # The ABI tag tells a free-threaded wheel apart from the GIL one.
      - name: Assert the Expected Interpreter Was Built
        shell: bash
        run: |
          ls -la wheelhouse/
          count=$(find wheelhouse -name "*-cp${{ matrix.python-version }}-*.whl" | wc -l)
          echo "wheels carrying ABI tag cp${{ matrix.python-version }}: ${count}"
          test "$count" -gt 0

      - name: Upload Wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-${{ matrix.os }}-cp${{ matrix.python-version }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Source Distribution
    needs: versioning
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Build Source Distribution
        run: |
          python -m pip install --upgrade build
          python -m build --sdist

      # The extension builds from the C ABI headers and the sibling submodules, so a sdist without them installs nowhere.
      - name: Assert the Headers Travel
        run: |
          listing=$(tar tzf dist/*.tar.gz)
          for pattern in "include/ustore/db\.h" "smashtable/include/" "stringzilla/include/" "numkong/include/" "forkunion/include/"; do
            printf '%s\n' "$listing" | grep -q "$pattern" || { echo "::error::the sdist lacks $pattern"; exit 1; }
          done

      - name: Upload Source Distribution
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish_python:
    name: Publish Python
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/ustore
    permissions:
      id-token: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "{cibw-*,sdist}"
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verbose: true
          print-hash: true

  publish_rust:
    name: Publish Rust
    needs: versioning
    runs-on: ubuntu-24.04
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Check out refreshed version
        if: env.CARGO_REGISTRY_TOKEN != ''
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Pull Git submodules
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: git submodule update --init --recursive
      - name: Set Up Rust
        if: env.CARGO_REGISTRY_TOKEN != ''
        uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish
