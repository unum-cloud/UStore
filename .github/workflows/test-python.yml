name: Test Python

on:
  workflow_call:

permissions:
  contents: read

env:
  PYTHONUTF8: 1
  PYTHONFAULTHANDLER: 1

jobs:
  test_python:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-26, windows-2025, windows-11-arm]
        python-version: ["3.12", "3.15t"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Pull Git Submodules
        run: git submodule update --init --recursive
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Build and Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Assert the GIL Stays Disabled
        if: ${{ endsWith(matrix.python-version, 't') }}
        run: python -c "import sys, ustore; assert not sys._is_gil_enabled(), 'importing ustore re-enabled the GIL'"

      - name: Test
        shell: bash
        run: |
          python -m pip install --group test
          python -X faulthandler -m pytest -x

  # The native Python builds fail in minutes, before the cibuildwheel jobs start.
  wheels:
    name: Build Python Wheels
    needs: test_python
    uses: ./.github/workflows/build-wheels.yml
    with:
      smoke: true
