name: Pre-Release

on:
  push:
    branches: ["main-dev"]
    paths-ignore: ["**/*.md", "LICENSE", ".gitignore", "assets/**"]
  pull_request:
    branches: ["main-dev"]
    paths-ignore: ["**/*.md", "LICENSE", ".gitignore", "assets/**"]

env:
  GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
  PYTHONUTF8: 1
  PYTHONFAULTHANDLER: 1

permissions:
  contents: read

# Superseded pull request runs cancel; pushes to `main-dev` finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versioning:
    name: Update Version
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run TinySemVer
        uses: ashvardanian/tinysemver@v3
        with:
          verbose: "true"
          version-file: "VERSION"
          update-version-in: |
            CITATION.cff:^version: (\d+\.\d+\.\d+)
            pyproject.toml:^version = "(\d+\.\d+\.\d+)"
            Cargo.toml:^version = "(\d+\.\d+\.\d+)"
          update-major-version-in: |
            include/ustore/ustore.h:^#define USTORE_VERSION_MAJOR (\d+)
          update-minor-version-in: |
            include/ustore/ustore.h:^#define USTORE_VERSION_MINOR (\d+)
          update-patch-version-in: |
            include/ustore/ustore.h:^#define USTORE_VERSION_PATCH (\d+)
          dry-run: "true"

  lint:
    name: Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Linters
        run: |
          python -m pip install --group lint
          npm install --global dprint

      # The same checks a commit runs locally, over everything this branch adds.
      - name: Check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: .githooks/lint-range "$BASE_SHA"

  test_cpp:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # The release preset builds with each platform's own toolchain, while the sanitizer presets assume Clang and lld.
        include:
          - { name: "Linux x86-64", os: ubuntu-26.04, preset: release }
          - { name: "Linux AArch64", os: ubuntu-26.04-arm, preset: release }
          - { name: "macOS arm64", os: macos-26, preset: release }
          - { name: "Windows x86-64", os: windows-2025, preset: release }
          - { name: "Windows ARM64", os: windows-11-arm, preset: release }
          - { name: "Linux x86-64 with ASan and UBSan", os: ubuntu-26.04, preset: debug }
          - { name: "Linux x86-64 with TSan", os: ubuntu-26.04, preset: tsan }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive

      - name: Install Toolchain on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang lld ninja-build
      - name: Install Toolchain on macOS
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install Toolchain on Windows
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - name: Set Up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      # Sanitizer runtimes crash under the runner kernel's 32-bit mmap randomization.
      - name: Lower ASLR Entropy
        if: matrix.preset != 'release'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Restore Fetched Dependencies
        uses: actions/cache@v6
        with:
          path: build_${{ matrix.preset }}/_deps
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ hashFiles('cmake/*.cmake') }}

      # Ninja takes the first compiler on the path, which on Windows runners can be MinGW's
      - name: Configure
        env:
          CC: ${{ runner.os == 'Windows' && 'cl' || '' }}
          CXX: ${{ runner.os == 'Windows' && 'cl' || '' }}
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  verify_models:
    name: Check Promela Models and GenMC Clients
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Install Spin, Clang and the GenMC Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y spin cmake clang-20 llvm-20-dev libffi-dev zlib1g-dev libedit-dev
      - name: Checkout GenMC
        uses: actions/checkout@v7
        with:
          repository: MPI-SWS/genmc
          ref: fe124db203f6d1a626057d72f07e25409075d809
          path: genmc
      - name: Restore the GenMC Build
        id: genmc
        uses: actions/cache@v6
        with:
          path: genmc/build
          key: genmc-fe124db-clang-20
      - name: Build GenMC
        if: steps.genmc.outputs.cache-hit != 'true'
        run: |
          cmake -S genmc -B genmc/build -D CMAKE_BUILD_TYPE=Release -D CMAKE_C_COMPILER=clang-20 -D CMAKE_CXX_COMPILER=clang++-20 -D LLVM_DIR=/usr/lib/llvm-20/lib/cmake/llvm
          cmake --build genmc/build --parallel
      - name: Check the Models and the Clients
        run: verification/check.sh
        env:
          GENMC: ${{ github.workspace }}/genmc/build/bin/genmc
          GENMC_CLANG: clang++-20

  test_python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-26, windows-2025, windows-11-arm]
        python-version: ["3.12", "3.14t"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Build and Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -v .

      - name: Assert the GIL Stays Disabled
        if: ${{ endsWith(matrix.python-version, 't') }}
        run: python -c "import sys, ustore; assert not sys._is_gil_enabled(), 'importing ustore re-enabled the GIL'"

      - name: Test
        shell: bash
        run: |
          python -m pip install --group test
          python -X faulthandler -m pytest -x

  test_rust:
    name: Rust on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-26, windows-2025, windows-11-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Set Up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Lint Rust
        if: matrix.os == 'ubuntu-26.04'
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test Rust
        run: cargo test --all-features

  # A smoke subset only; the full matrix runs on release.
  build_wheels:
    name: Wheels ${{ matrix.os }} cp${{ matrix.python-version }}
    needs: test_python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
        python-version: ["312", "314t"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Build Wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_BUILD: cp${{ matrix.python-version }}-*
          CIBW_ARCHS: native
          CIBW_SKIP: "*-musllinux_*"
