name: Pre-Release

on:
  push:
    branches: ["main-dev"]
    paths-ignore: ["**/*.md", "LICENSE", ".gitignore", "assets/**"]
  pull_request:
    branches: ["main-dev"]
    paths-ignore: ["**/*.md", "LICENSE", ".gitignore", "assets/**"]

env:
  GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
  PYTHONUTF8: 1
  PYTHONFAULTHANDLER: 1

permissions:
  contents: read

# Superseded pull request runs cancel; pushes to `main-dev` finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versioning:
    name: Update Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run TinySemVer
        uses: ashvardanian/tinysemver@v3
        with:
          verbose: "true"
          version-file: "VERSION"
          update-version-in: |
            CITATION.cff:^version: (\d+\.\d+\.\d+)
            pyproject.toml:^version = "(\d+\.\d+\.\d+)"
            Cargo.toml:^version = "(\d+\.\d+\.\d+)"
          update-major-version-in: |
            include/ustore/ustore.h:^#define USTORE_VERSION_MAJOR (\d+)
          update-minor-version-in: |
            include/ustore/ustore.h:^#define USTORE_VERSION_MINOR (\d+)
          update-patch-version-in: |
            include/ustore/ustore.h:^#define USTORE_VERSION_PATCH (\d+)
          dry-run: "true"

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Linters
        run: |
          python -m pip install --group lint
          npm install --global dprint

      # The same checks a commit runs locally, over everything this branch adds.
      - name: Check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: .githooks/lint-range "$BASE_SHA"

  test_cpp:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # The base preset's clang and lld are installed on Linux only: macOS links with ld64, Windows builds with MSVC.
        include:
          - { name: "Linux x86-64", os: ubuntu-24.04, preset: release, configure: "" }
          - { name: "Linux AArch64", os: ubuntu-24.04-arm, preset: release, configure: "" }
          - {
              name: "macOS arm64",
              os: macos-15,
              preset: release,
              configure: "-DCMAKE_EXE_LINKER_FLAGS= -DCMAKE_SHARED_LINKER_FLAGS=",
            }
          - {
              name: "Windows x86-64",
              os: windows-2025,
              preset: release,
              configure: "-DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_EXE_LINKER_FLAGS= -DCMAKE_SHARED_LINKER_FLAGS=",
            }
          # LevelDB 1.23's env_posix.cc names std::memory_order::memory_order_relaxed, which libstdc++ 15 dropped,
          # so the sanitizer trees build without it.
          - {
              name: "Linux x86-64 (ASan, UBSan)",
              os: ubuntu-24.04,
              preset: debug,
              configure: "-DUSTORE_USE_LEVELDB=OFF",
            }
          - { name: "Linux x86-64 (TSan)", os: ubuntu-24.04, preset: tsan, configure: "-DUSTORE_USE_LEVELDB=OFF" }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive

      - name: Install Toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang lld ninja-build
      - name: Install Toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install Toolchain (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - name: Set Up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Sanitizer runtimes crash under the runner kernel's 32-bit mmap randomization.
      - name: Lower ASLR Entropy
        if: matrix.preset != 'release'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Restore Fetched Dependencies
        uses: actions/cache@v6
        with:
          path: build_${{ matrix.preset }}/_deps
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ hashFiles('cmake/*.cmake') }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} ${{ matrix.configure }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  test_python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
        python-version: ["3.12", "3.14t"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Build and Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -v .

      - name: Assert the GIL Stays Disabled
        if: ${{ endsWith(matrix.python-version, 't') }}
        run: python -c "import sys, ustore; assert not sys._is_gil_enabled(), 'importing ustore re-enabled the GIL'"

      - name: Test
        shell: bash
        run: |
          python -m pip install --group test
          python -m pytest test -x -q

  # RocksDB and LevelDB linked into the extension, on the floor Python version only - the OS matrix above already
  # exercises SmashTable, the default link, on every platform.
  test_python_engines:
    name: Python (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: rocksdb, define: USTORE_USE_ROCKSDB }
          - { engine: leveldb, define: USTORE_USE_LEVELDB }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Build and Install
        env:
          CMAKE_ARGS: "-D${{ matrix.define }}=ON -DUSTORE_PYTHON_ENGINE=${{ matrix.engine }}"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -v .
      - name: Test
        run: |
          python -m pip install --group test
          python -m pytest test -x -q

  test_rust:
    name: Rust on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Set Up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Lint Rust
        if: matrix.os == 'ubuntu-24.04'
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test Rust
        run: cargo test --all-features

  # A smoke subset only; the full matrix runs on release.
  build_wheels:
    name: Wheels ${{ matrix.os }} cp${{ matrix.python-version }}
    needs: test_python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python-version: ["312", "314t"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Build Wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_BUILD: cp${{ matrix.python-version }}-*
          CIBW_ARCHS: native
          CIBW_SKIP: "*-musllinux_*"
          CIBW_TEST_COMMAND: python -c "import ustore"
