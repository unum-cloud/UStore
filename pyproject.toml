# Wheels for CPython 3.12 to 3.15 and the free-threaded 3.14t and 3.15t, from the project's own CMake tree.
[build-system]
build-backend = "scikit_build_core.build"
requires = ["scikit-build-core>=0.10"]

[project]
name = "ustore"
version = "1.0.0-rc.1"
description = "GPU-Accelerated Embedded Transactional Database for High-Throughput NVMe Devices"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Ash Vardanian", email = "info@unum.cloud" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Natural Language :: English",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: C",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Database",
  "Topic :: Database :: Database Engines/Servers",
]
dependencies = []

[project.urls]
Homepage = "https://unum.cloud/ustore"
Documentation = "https://unum.cloud/ustore"
Repository = "https://github.com/unum-cloud/UStore"
Issues = "https://github.com/unum-cloud/UStore/issues"

# The RAM, RocksDB, LevelDB and NVMe engines, NVMe without CUDA;
# `CMAKE_ARGS="-DUSTORE_WITH_ROCKSDB=OFF"` or `--config-settings=cmake.define.USTORE_WITH_ROCKSDB=OFF`
# leaves one out.
[tool.scikit-build]
build-dir = "build_python/{wheel_tag}"
build.targets = ["ustore_python"]
cmake.build-type = "Release"
cmake.version = ">=3.28"
install.components = ["ustore_python"]
minimum-version = "build-system.requires"
sdist.exclude = [
  "/build*/**",
  "/target/**",
  "/v1.md",
  "/numkong/**",
  "/stringzilla/**",
  "/smashtable/**",
  "/forkunion/**",
]
sdist.include = [
  "/CMakeLists.txt",
  "/CMakePresets.json",
  "/VERSION",
  "/c/ustore/**",
  "/cpp/ustore/**",
  "/include/ustore/**",
  "/src/**",
  "/src_oracles/**",
  "/cmake/**",
  "/tools/**",
  "/python/**",
  "/numkong/include/**",
  "/stringzilla/CMakeLists.txt",
  "/stringzilla/VERSION",
  "/stringzilla/cmake/**",
  "/stringzilla/c/**",
  "/stringzilla/probes/**",
  "/stringzilla/include/**",
  "/smashtable/CMakeLists.txt",
  "/smashtable/VERSION",
  "/smashtable/cmake/**",
  "/smashtable/include/**",
  "/forkunion/CMakeLists.txt",
  "/forkunion/VERSION",
  "/forkunion/cmake/**",
  "/forkunion/c/**",
  "/forkunion/probes/**",
  "/forkunion/include/**",
]
wheel.packages = ["python/ustore"]

[tool.scikit-build.cmake.define]
USTORE_BUILD_PYTHON = "ON"
USTORE_WITH_LEVELDB = "ON"
USTORE_WITH_NVME = "ON"
USTORE_WITH_ROCKSDB = "ON"

# Groups rather than extras, so none of this reaches the published wheel's metadata.
[dependency-groups]
lint = ["ruff", "clang-format==22.*", "cmakelang"]
# PyArrow publishes no Windows on Arm wheels, so the Parquet case skips there.
test = [
  "pytest>=8",
  "numpy",
  "pandas",
  "networkx",
  "pyarrow; platform_machine != 'ARM64'",
]

[tool.pytest.ini_options]
# `-p no:randomly` keeps `<PROJECT>_SEED` in charge wherever pytest-randomly happens to be installed.
addopts = [
  "-ra",
  "--showlocals",
  "--strict-markers",
  "--strict-config",
  "-p",
  "no:randomly",
]
filterwarnings = ["error"]
minversion = "8.0"
python_files = ["*.py"]
testpaths = ["test"]
xfail_strict = true

[tool.ruff.lint]
extend-select = ["D", "I", "TID"]

[tool.ruff.lint.per-file-ignores]
# cmake-format evaluates its profile with `section` already in scope.
".cmake-format.py" = ["F821"]
"!python/**" = ["D"]
"*.pyi" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
# The package is ours, so it sorts after the third-party block rather than inside it.
known-first-party = ["ustore"]
combine-as-imports = true

[tool.ruff]
# Markdown belongs to markdownlint, so a directory-wide `ruff format` never rewrites a README's examples.
extend-exclude = ["*.md"]
line-length = 120
target-version = "py312"

[tool.cibuildwheel]
build = ["cp312-*", "cp313-*", "cp314-*", "cp314t-*", "cp315-*", "cp315t-*"]
build-verbosity = 0
skip = ["*musllinux*"]
test-command = "python -X faulthandler -m pytest -x {project}/test"
test-groups = ["test"]

# Every architecture's baseline instruction set, since the CMake tree adds no `-march` of its own.
[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
before-build = ["rm -rf {project}/build_python"]
manylinux-aarch64-image = "manylinux_2_28"
manylinux-x86_64-image = "manylinux_2_28"
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
archs = ["arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64", "ARM64"]
