# Wheels for CPython 3.12 to 3.14 and the free-threaded 3.14t, from the project's own CMake tree.
[build-system]
build-backend = "scikit_build_core.build"
requires = ["scikit-build-core>=0.10"]

[project]
name = "ustore"
version = "1.0.0-rc.1"
description = "GPU-Accelerated Embedded Transactional Database for High-Throughput NVMe Devices"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Ash Vardanian", email = "info@unum.cloud" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Natural Language :: English",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: C",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Database",
  "Topic :: Database :: Database Engines/Servers",
]
dependencies = []

[project.urls]
Homepage = "https://unum.cloud/ustore"
Documentation = "https://unum.cloud/ustore"
Repository = "https://github.com/unum-cloud/UStore"
Issues = "https://github.com/unum-cloud/UStore/issues"

# SmashTable alone by default; `CMAKE_ARGS="-DUSTORE_USE_ROCKSDB=ON"` or
# `--config-settings=cmake.define.USTORE_USE_ROCKSDB=ON` adds an engine.
[tool.scikit-build]
build-dir = "build_python/{wheel_tag}"
build.targets = ["ustore_python"]
cmake.build-type = "Release"
cmake.version = ">=3.25"
install.components = ["ustore_python"]
minimum-version = "build-system.requires"
sdist.exclude = ["/v1.md", "/numkong/**", "/stringzilla/**", "/smashtable/**", "/forkunion/**"]
sdist.include = [
  "/CMakeLists.txt",
  "/CMakePresets.json",
  "/VERSION",
  "/include/**",
  "/c/**",
  "/src/**",
  "/cmake/**",
  "/tools/**",
  "/python/**",
  "/numkong/include/**",
  "/stringzilla/include/**",
  "/smashtable/include/**",
  "/forkunion/CMakeLists.txt",
  "/forkunion/VERSION",
  "/forkunion/cmake/**",
  "/forkunion/c/**",
  "/forkunion/include/**",
]
wheel.packages = ["python/ustore"]

[tool.scikit-build.cmake.define]
USTORE_BUILD_BENCH_CPP = "OFF"
USTORE_BUILD_LIB_PYTHON = "ON"
USTORE_BUILD_TEST_CPP = "OFF"
USTORE_BUILD_TOOLS_CPP = "OFF"

# Groups rather than extras, so none of this reaches the published wheel's metadata.
[dependency-groups]
lint = ["ruff"]
test = ["pytest>=8", "numpy", "pandas", "networkx"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# cmake-format evaluates its profile with `section` already in scope.
".cmake-format.py" = ["F821"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.cibuildwheel]
build = ["cp312-*", "cp313-*", "cp314-*", "cp314t-*"]
build-verbosity = 0
skip = ["*musllinux*"]

# Every architecture's baseline instruction set, since the CMake tree adds no `-march` of its own.
[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
before-build = ["rm -rf {project}/build_python"]
manylinux-aarch64-image = "manylinux_2_28"
manylinux-x86_64-image = "manylinux_2_28"
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
archs = ["arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
