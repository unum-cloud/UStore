[package]
name = "ustore"
version = "1.0.0-rc.1"
rust-version = "1.100"
edition = "2024"
authors = ["Ash Vardanian <info@unum.cloud>"]
description = "GPU-Accelerated Multi-Modal Transactional Database Engine Built around Kernel Bypass"
license = "Apache-2.0"
repository = "https://github.com/unum-cloud/UStore"
homepage = "https://www.unum.cloud/docs/ustore"
documentation = "https://www.unum.cloud/docs/ustore/rust"
links = "ustore"
include = [
  "/Cargo.toml",
  "/build.rs",
  "/rust/**",
  "/CMakeLists.txt",
  "/VERSION",
  "/cmake/**",
  "/c/ustore/**",
  "/cpp/ustore/**",
  "/include/ustore/**",
  "/src/**",
  "/src_oracles/**",
  "/tools/**",
]

[lib]
name = "ustore"
path = "rust/lib.rs"

# The `ram` engine always builds; each engine feature adds its engine to the one library, and without it the engine's
# `Database::open_*` fails with `Status::Unsupported`.
[features]
default = ["rocksdb", "leveldb"]
leveldb = []
nvme = []
rocksdb = []
# Reads documents straight into `serde` types.
serde = ["dep:serde", "jsontape/serde"]

[dependencies]
# The siblings' crates hold the trees `build.rs` hands CMake, and ForkUnion and StringZilla link their own archives.
forkunion = { version = "4.0.0-rc.1", git = "https://github.com/ashvardanian/ForkUnion", rev = "6bd10ce124b3804719ca297ac61092ac5773d627", default-features = false }
jsontape = "0.1.4"
serde = { version = "1", optional = true }
smashtable = { version = "1.0.0-rc.1", git = "https://github.com/ashvardanian/SmashTable", rev = "09caec7b2084dd20a6563c8f0e87448eebf90d43" }
stringtape = "2.5.0"
stringzilla = { version = "6.0.0-rc.1", git = "https://github.com/ashvardanian/StringZilla", rev = "e224583f7477e5a858e99897229e9665862bc071", default-features = false }

[build-dependencies]
cmake = "0.1"

[package.metadata.docs.rs]
features = ["serde"]
