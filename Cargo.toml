[package]
name = "ustore"
version = "1.0.0-rc.1"
edition = "2021"
authors = ["Ash Vardanian <info@unum.cloud>"]
description = "GPU-Accelerated Embedded Transactional Database for High-Throughput NVMe Devices"
license = "Apache-2.0"
repository = "https://github.com/unum-cloud/UStore"
links = "ustore"
include = [
  "/Cargo.toml",
  "/build.rs",
  "/rust/**",
  "/CMakeLists.txt",
  "/VERSION",
  "/cmake/**",
  "/include/**",
  "/src/**",
  "/src_oracles/**",
  "/tools/**",
  "/smashtable/CMakeLists.txt",
  "/smashtable/VERSION",
  "/smashtable/cmake/**",
  "/smashtable/include/**",
  "/stringzilla/CMakeLists.txt",
  "/stringzilla/VERSION",
  "/stringzilla/cmake/**",
  "/stringzilla/c/**",
  "/stringzilla/probes/**",
  "/stringzilla/include/**",
  "/forkunion/CMakeLists.txt",
  "/forkunion/VERSION",
  "/forkunion/cmake/**",
  "/forkunion/c/**",
  "/forkunion/probes/**",
  "/forkunion/include/**",
]

[lib]
name = "ustore"
path = "rust/lib.rs"

# The `ram` engine always builds; each engine feature adds its engine to the one library, and without it the engine's
# `Database::open_*` fails with `Status::Unsupported`.
[features]
default = ["rocksdb", "leveldb"]
leveldb = []
nvme = []
rocksdb = []
# Reads documents straight into `serde` types.
serde = ["dep:serde", "jsontape/serde"]

[dependencies]
jsontape = "0.1.4"
serde = { version = "1", optional = true }
stringtape = "2.5.0"

[build-dependencies]
cmake = "0.1"
