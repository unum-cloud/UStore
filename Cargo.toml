[package]
name = "ustore"
version = "1.0.0-rc.1"
rust-version = "1.100"
edition = "2024"
authors = ["Ash Vardanian <info@unum.cloud>"]
description = "GPU-Accelerated Multi-Modal Transactional Database Engine Built around Kernel Bypass"
license = "Apache-2.0"
repository = "https://github.com/unum-cloud/UStore"
homepage = "https://www.unum.cloud/docs/ustore"
documentation = "https://www.unum.cloud/docs/ustore/rust"
links = "ustore"
include = [
  "/Cargo.toml",
  "/build.rs",
  "/rust/**",
  "/CMakeLists.txt",
  "/VERSION",
  "/cmake/**",
  "/c/ustore/**",
  "/cpp/ustore/**",
  "/include/ustore/**",
  "/src/**",
  "/src_oracles/**",
  "/tools/**",
]

[lib]
name = "ustore"
path = "rust/lib.rs"

# Its own binary, since it counts every allocation through a global allocator.
[[test]]
name = "deferred_allocations"
path = "rust/tests/deferred_allocations.rs"
harness = false

# The `ram` engine always builds; each engine feature adds its engine to the one library, and without it the engine's
# `Database::open_*` fails with `Status::Unsupported`.
[features]
default = ["rocksdb", "leveldb"]
leveldb = []
nvme = []
rocksdb = []
# Reads documents straight into `serde` types.
serde = ["dep:serde", "jsontape/serde"]

[dependencies]
# The siblings' crates hold the trees `build.rs` hands CMake, and ForkUnion and StringZilla link their own archives.
forkunion = { version = "4.0.0-rc.1", git = "https://github.com/ashvardanian/ForkUnion", rev = "59662d01e66ee40a87d8f5b28387a29d16c78ddd", default-features = false }
jsontape = "0.1.4"
serde = { version = "1", optional = true }
smashtable = { version = "1.0.0-rc.1", git = "https://github.com/ashvardanian/SmashTable", rev = "e44798287a3aca9a263ba4fd7a98076d7a803f7f" }
stringtape = "2.5.0"
stringzilla = { version = "6.0.0-rc.1", git = "https://github.com/ashvardanian/StringZilla", rev = "135694cbbbb1b0fb06d807d7c1bf41596e98db82", default-features = false }

[build-dependencies]
cmake = "0.1"

[package.metadata.docs.rs]
features = ["serde"]
