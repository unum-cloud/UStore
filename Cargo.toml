[package]
name = "ustore"
version = "1.0.0-rc.1"
edition = "2021"
authors = ["Ash Vardanian <info@unum.cloud>"]
description = "GPU-Accelerated Embedded Transactional Database for High-Throughput NVMe Devices"
license = "Apache-2.0"
repository = "https://github.com/unum-cloud/UStore"
links = "ustore"
include = [
  "/Cargo.toml",
  "/build.rs",
  "/rust/**",
  "/CMakeLists.txt",
  "/VERSION",
  "/cmake/**",
  "/c/ustore/**",
  "/cpp/ustore/**",
  "/src/**",
  "/src_oracles/**",
  "/tools/**",
]

[lib]
name = "ustore"
path = "rust/lib.rs"

# The `ram` engine always builds; each engine feature adds its engine to the one library, and without it the engine's
# `Database::open_*` fails with `Status::Unsupported`.
[features]
default = ["rocksdb", "leveldb"]
leveldb = []
nvme = []
rocksdb = []
# Reads documents straight into `serde` types.
serde = ["dep:serde", "jsontape/serde"]

[dependencies]
# The siblings' crates carry the trees `build.rs` hands CMake, and ForkUnion and StringZilla link their own archives.
forkunion = { version = "4.0.0-rc.1", default-features = false }
jsontape = "0.1.4"
serde = { version = "1", optional = true }
smashtable = "1.0.0-rc.1"
stringtape = "2.5.0"
stringzilla = { version = "6.0.0-rc.1", default-features = false }

[build-dependencies]
cmake = "0.1"
